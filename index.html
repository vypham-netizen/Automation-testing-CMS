<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma trận phân quyền CMS POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 24px}
header h1{font-size:19px;font-weight:700}
header p{font-size:12px;opacity:.85;margin-top:3px}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.rbtn{border:1px solid #cbd5e1;background:#fff;color:#334155;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600}
.rbtn:hover{background:#f1f5f9}
.rbtn.active{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
#search{flex:1;min-width:180px;border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;font-size:13px}
.tbtn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12px;color:#475569}
.tbtn:hover{background:#f1f5f9}
.wrap{padding:16px 24px 60px;max-width:1200px;margin:0 auto}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;min-width:120px}
.card .n{font-size:22px;font-weight:700;color:#1e3a8a}
.card .l{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.mod{background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;overflow:hidden}
.mhead{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;background:#f8fafc;border-left:4px solid #1e3a8a}
.mhead:hover{background:#f1f5f9}
.mhead .arrow{transition:transform .15s;color:#64748b;font-size:12px}
.mod.open .arrow{transform:rotate(90deg)}
.mhead .mname{font-weight:700;font-size:14px}
.tag{font-size:10px;background:#dbeafe;color:#1e40af;padding:2px 7px;border-radius:6px;font-weight:600}
.cnt{margin-left:auto;font-size:11px;color:#94a3b8}
.mbody{display:none}
.mod.open .mbody{display:block}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 12px;border-top:1px solid #f1f5f9;vertical-align:top}
th{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;background:#fff}
td.feat{font-weight:600;width:38%}
.role-col{width:auto}
.chip{display:inline-block;color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;margin:2px 3px 2px 0;white-space:nowrap}
.none{color:#cbd5e1;font-size:12px}
.rolehdr{font-weight:700;color:#1e3a8a}
.empty{padding:30px;text-align:center;color:#94a3b8}
.legend{margin-top:18px;font-size:12px;color:#475569;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px}
.legend .chip{margin-right:4px}
.warn{color:#b45309;font-weight:600}
</style></head>

const {roles, word, color, rows} = DATA;
let curRole = "Tất cả";
let query = "";

function chip(code){
  const label = word[code] || code;
  return `<span class="chip" style="background:${color[code]||'#64748b'}">${label}</span>`;
}
function rolePerms(r, role){ return r.perms[role] || []; }

function visibleRows(){
  return rows.filter(r=>{
    if(query && !(r.feat.toLowerCase().includes(query) || r.mod.toLowerCase().includes(query))) return false;
    if(curRole!=="Tất cả" && rolePerms(r,curRole).length===0) return false;
    return true;
  });
}

function renderRolesBar(){
  const el = document.getElementById('roles');
  const all = ["Tất cả", ...roles];
  el.innerHTML = all.map(r=>`<button class="rbtn ${r===curRole?'active':''}" data-r="${r}">${r}</button>`).join('');
  el.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>{curRole=b.dataset.r;render();});
}

function renderSummary(){
  const el=document.getElementById('summary');
  const vis=visibleRows();
  let cards=`<div class="card"><div class="n">${vis.length}</div><div class="l">Chức năng hiển thị</div></div>`;
  roles.forEach(role=>{
    const c=rows.filter(r=>rolePerms(r,role).length>0).length;
    const on = (curRole===role);
    cards+=`<div class="card" style="${on?'border-color:#1e3a8a;border-width:2px':''}"><div class="n">${c}</div><div class="l">${role}</div></div>`;
  });
  el.innerHTML=cards;
}

function renderList(){
  const el=document.getElementById('list');
  const vis=visibleRows();
  if(vis.length===0){el.innerHTML='<div class="empty">Không có chức năng nào khớp.</div>';return;}
  // group by module (giữ thứ tự xuất hiện)
  const groups=[]; const idx={};
  vis.forEach(r=>{
    const key=r.mod+' | '+r.rel;
    if(!(key in idx)){idx[key]=groups.length;groups.push({mod:r.mod,rel:r.rel,items:[]});}
    groups[idx[key]].items.push(r);
  });
  const showRoles = curRole==="Tất cả" ? roles : [curRole];
  el.innerHTML=groups.map((g,gi)=>{
    const head=`<div class="mhead"><span class="arrow">▶</span><span class="mname">${g.mod}</span><span class="tag">v${g.rel}</span><span class="cnt">${g.items.length} chức năng</span></div>`;
    let th=`<th>Chức năng</th>`+showRoles.map(r=>`<th class="rolehdr">${r}</th>`).join('');
    const body=g.items.map(it=>{
      const cells=showRoles.map(role=>{
        const ps=rolePerms(it,role);
        return `<td class="role-col">${ps.length?ps.map(chip).join(''):'<span class="none">—</span>'}</td>`;
      }).join('');
      return `<tr><td class="feat">${it.feat}</td>${cells}</tr>`;
    }).join('');
    return `<div class="mod open"><div class="mhead-w">${head}</div><div class="mbody"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join('');
  el.querySelectorAll('.mod').forEach(m=>{
    m.querySelector('.mhead').onclick=()=>m.classList.toggle('open');
  });
}

function renderLegend(){
  const order=["V","C","E","D","A","S","X"];
  const std=order.slice(0,4).map(chip).join(' ');
  const spe=order.slice(4).map(chip).join(' ');
  document.getElementById('legend').innerHTML=
    `<b>Chú thích quyền:</b> &nbsp; ${std} <span style="color:#94a3b8">(chuẩn: Xem/Tạo/Sửa/Xóa)</span> &nbsp;|&nbsp; ${spe} <span class="warn">(suy đoán: Thẩm định?/Gửi?/Xuất? — cần xác nhận legend gốc)</span>`;
}

function render(){renderRolesBar();renderSummary();renderList();renderLegend();}

document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderSummary();renderList();};
document.getElementById('expandAll').onclick=()=>document.querySelectorAll('.mod').forEach(m=>m.classList.add('open'));
document.getElementById('collapseAll').onclick=()=>document.querySelectorAll('.mod').forEach(m=>m.classList.remove('open'));
render();
</script>
</body></html>
